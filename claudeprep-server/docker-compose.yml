version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claudeprep
      POSTGRES_PASSWORD: claudeprep
      POSTGRES_DB: claudeprep
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudeprep"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://claudeprep:claudeprep@db:5432/claudeprep
      JWT_SECRET: change-me-in-production-use-openssl-rand-hex-32
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
